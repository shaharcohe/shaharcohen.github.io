title: Science Bites
author: Shahar Cohen
description: My blog
tagline: Notes, stories and photos.
lang: en

# Optional: a photo of you, e.g. /assets/images/me.jpg (used in "About me" and on posts)
author_image:

# Optional: links to your profiles. Leave empty to hide an icon.
social:
  instagram:
  x:
  facebook:
  pinterest:

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
