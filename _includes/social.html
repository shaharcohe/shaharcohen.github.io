<div class="social">
  {% if site.social.facebook %}<a href="{{ site.social.facebook }}" aria-label="Facebook" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><text x="12.6" y="17.6" text-anchor="middle" font-size="15" font-weight="700" font-family="Arial, sans-serif" fill="#fff">f</text></svg></a>{% endif %}
  {% if site.social.instagram %}<a href="{{ site.social.instagram }}" aria-label="Instagram" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><rect x="6.5" y="6.5" width="11" height="11" rx="3.2" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="15.3" cy="8.7" r=".9" fill="#fff"/></svg></a>{% endif %}
  {% if site.social.x %}<a href="{{ site.social.x }}" aria-label="X" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M8 7.5l8 9M16 7.5l-8 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>{% endif %}
  {% if site.social.pinterest %}<a href="{{ site.social.pinterest }}" aria-label="Pinterest" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" font-family="Georgia, serif" fill="#fff">P</text></svg></a>{% endif %}
  <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><circle cx="8.6" cy="15.4" r="1.5" fill="#fff"/><path d="M7.4 11.2a5.4 5.4 0 0 1 5.4 5.4M7.4 7.4a9.2 9.2 0 0 1 9.2 9.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>
</div>
