{% assign blog_active = false %}{% if page.url == '/blog/' or page.layout == 'post' %}{% assign blog_active = true %}{% endif %}
<header class="site-header">
  <div class="wrap header-bar">
    <span class="cell spacer edge" aria-hidden="true"></span>
    <span class="cell spacer" aria-hidden="true"></span>
    <nav class="nav" aria-label="Main">
      <a class="cell" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a class="cell" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a class="cell" href="{{ '/blog/' | relative_url }}"{% if blog_active %} aria-current="page"{% endif %}>Blog</a>
      <a class="cell" href="{{ '/photos/' | relative_url }}"{% if page.url == '/photos/' %} aria-current="page"{% endif %}>Photos</a>
    </nav>
    <span class="cell spacer" aria-hidden="true"></span>
    <div class="cell social-cell">{% include social.html %}</div>
  </div>
</header>
