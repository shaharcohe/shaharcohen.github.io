{% assign ph = forloop.index0 | modulo: 4 | plus: 1 %}
<article class="card">
  <a class="card-link" href="{{ post.url | relative_url }}">
    <div class="card-media ph-{{ ph }}">
      {% if post.image %}
        <img src="{{ post.image | relative_url }}" alt="{{ post.image_alt | default: '' }}" loading="lazy">
      {% else %}
        <span class="card-placeholder" aria-hidden="true">{{ post.title | slice: 0 }}</span>
      {% endif %}
    </div>
    <div class="card-body">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      <h3>{{ post.title }}</h3>
      <p>{{ post.description | default: post.excerpt | strip_html | truncatewords: 28 }}</p>
    </div>
  </a>
</article>
