<footer class="site-footer">
  <div class="wrap footer-grid">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">{% include logo.html %}</a>
    <ul class="footer-links">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <li><a href="{{ '/photos/' | relative_url }}">Photos</a></li>
    </ul>
    <ul class="footer-links">
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></li>
    </ul>
    {% include social.html %}
    <p class="copyright">&copy; {{ 'now' | date: '%Y' }} by {{ site.author }}.</p>
  </div>
</footer>
